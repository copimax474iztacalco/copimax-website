  <text x="135" y="165" fill="#71717a" font-size="13" font-weight="700" text-anchor="middle">CONTRAPORTADA</text>
  <text x="135" y="225" fill="#111111" font-size="36" font-weight="900" text-anchor="middle">Pág. 8</text>
