<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Comparativa de precios de escaneo en CDMX 2026: Office Depot $10 vs Lumen $5 vs Copimax $2.00 (1-99), $1.50 (100-999) y $1.00 (1,000+ hojas)">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="winGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="20" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="912" height="492" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="48" y="68" fill="#38bdf8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5">ESTUDIO DE PRECIOS DE ESCANEO EN CDMX · 2026 (CARTA Y OFICIO ADF)</text>
  <text x="48" y="104" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">¿Cuánto cuesta escanear 1,000 hojas en Ciudad de México?</text>
  <text x="48" y="132" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">Comparativa real entre cadenas de papelería (cama plana/menudeo) y planta de digitalización masiva ADF Copimax</text>

  <!-- Bar 1: Office Depot -->
  <rect x="48" y="162" width="864" height="82" rx="12" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.5"/>
  <text x="70" y="196" fill="#fca5a5" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">CADENA COMERCIAL TIPO OFFICE DEPOT ($10.00 MXN / HOJA)</text>
  <rect x="70" y="210" width="640" height="18" rx="9" fill="#ef4444"/>
  <text x="728" y="224" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900">$10,000 MXN</text>

  <!-- Bar 2: Lumen -->
  <rect x="48" y="258" width="864" height="82" rx="12" fill="#1f2421" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="70" y="292" fill="#fcd34d" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">HIPERPAPELERÍA TIPO LUMEN / CENTRO LOCAL ($5.00 MXN / HOJA)</text>
  <rect x="70" y="306" width="320" height="18" rx="9" fill="#f59e0b"/>
  <text x="408" y="320" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900">$5,000 MXN</text>

  <!-- Bar 3: Copimax Mayoreo -->
  <rect x="48" y="354" width="864" height="94" rx="14" fill="#06281e" stroke="#10b981" stroke-width="2.5"/>
  <text x="70" y="388" fill="#6ee7b7" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900">★ PLANTA COPIMAX IZTACALCO · MAYOREO 1,000+ HOJAS ($1.00 MXN / HOJA)</text>
  <rect x="70" y="404" width="64" height="22" rx="11" fill="url(#winGrad)"/>
  <text x="150" y="422" fill="#34d399" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900">$1,000 MXN</text>
  <rect x="330" y="396" width="556" height="34" rx="8" fill="#047857"/>
  <text x="608" y="418" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">¡AHORRAS HASTA $9,000 MXN (-90%) Y QUEDA EN 10 MIN EN ADF!</text>

  <!-- Footer Tiers -->
  <rect x="48" y="464" width="276" height="36" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="186" y="487" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">1 a 99 hojas: $2.00 MXN / hoja</text>

  <rect x="342" y="464" width="276" height="36" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="480" y="487" text-anchor="middle" fill="#38bdf8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">100 a 999 hojas: $1.50 MXN / hoja</text>

  <rect x="636" y="464" width="276" height="36" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="774" y="487" text-anchor="middle" fill="#6ee7b7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="900">1,000+ hojas: $1.00 MXN / hoja</text>
</svg>
